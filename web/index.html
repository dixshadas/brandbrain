    .mk-sweep::after{display:none}

const cx = (...a) => a.filter(Boolean).join(" ");

function WelcomeConstellation() {
  const pts=[[160,120],[340,70],[560,150],[780,90],[980,170],[220,320],[470,270],[720,300],[940,340],[120,480],[380,470],[640,460],[880,520],[520,560]];
  const links=[[0,1],[1,2],[2,3],[3,4],[1,6],[2,6],[5,6],[6,7],[7,8],[5,9],[6,10],[7,11],[8,12],[10,13],[11,13],[10,11]];
  // A few edges carry a travelling "signal", flowing connections into the brain.
  const signals=[[0,6],[4,7],[9,10],[12,7],[3,2],[13,6]];
  return <svg viewBox="0 0 1100 640" className="absolute inset-0 w-full h-full opacity-[.24]" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="wbrainglow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stopColor="#A5B4FC" stopOpacity="0.9"/>
        <stop offset="45%" stopColor="#6366F1" stopOpacity="0.35"/>
        <stop offset="100%" stopColor="#6366F1" stopOpacity="0"/>
      </radialGradient>
    </defs>
    {/* central intelligence, a glowing brain the evidence flows into */}
    <circle cx="540" cy="315" r="150" fill="url(#wbrainglow)" className="ghalo"/>
    {links.map(([a,b],i)=><line key={i} x1={pts[a][0]} y1={pts[a][1]} x2={pts[b][0]} y2={pts[b][1]}
      stroke="#818CF8" strokeWidth="1" className="edgeflow"/>)}
    {/* travelling signal particles, subtle premium motion along the connections */}
    {signals.map(([a,b],i)=><circle key={"s"+i} r={3.2} fill={i%2?"#34D399":"#818CF8"}>
      <animateMotion dur={`${3.6+i*0.7}s`} repeatCount="indefinite" begin={`${i*0.6}s`}
        path={`M${pts[a][0]} ${pts[a][1]} L${pts[b][0]} ${pts[b][1]}`}/>
      <animate attributeName="opacity" values="0;1;1;0" dur={`${3.6+i*0.7}s`} repeatCount="indefinite" begin={`${i*0.6}s`}/>
    </circle>)}
    {pts.map((p,i)=><g key={i} className="wfloat" style={{animationDelay:`${(i%7)*.9}s`}}>
      <circle cx={p[0]} cy={p[1]} r={i%3===0?7:4.5} fill={i%4===0?"#6366F1":i%4===1?"#10B981":i%4===2?"#D946EF":"#0EA5E9"} className="wpulse" style={{animationDelay:`${(i%5)*.7}s`}}/>
    </g>)}
  </svg>;
}
// The commercial decision flow, Evidence → Reasoning → Simulation → Recommendation → Living Brain.
const WELCOME_FLOW=[
  {icon:"library", label:"Evidence"},
  {icon:"sparkles",label:"Reasoning"},
  {icon:"users",   label:"Simulation"},
  {icon:"bolt",    label:"Recommendation"},
  {icon:"brain",   label:"Living Brain"},
];
function WelcomeFlow(){
  const [n,setN]=useState(0);
  useEffect(()=>{ const t=setInterval(()=>setN(v=>(v+1)%(WELCOME_FLOW.length+1)),1100); return ()=>clearInterval(t); },[]);
  return <div className="flex flex-wrap items-center justify-center gap-y-2 gap-x-1 sm:gap-1.5 rounded-2xl border border-white/10 bg-white/[.04] backdrop-blur-sm px-3 py-2.5 max-w-full">
    {WELCOME_FLOW.map((s,i)=>{ const SIc=Icon[s.icon]; const on=i<n;
      return <React.Fragment key={s.label}>
        <div className={cx("inline-flex items-center gap-1.5 rounded-xl px-2 sm:px-2.5 py-1.5 transition-all duration-500", on?"bg-white/10":"")}>
          <span className={cx("w-6 h-6 rounded-lg grid place-items-center shrink-0 transition-colors duration-500", on?"bg-indigo-500/30 text-indigo-200":"bg-white/5 text-slate-500")}><SIc size={13}/></span>

// Entry: fade + 12px rise, 500ms, staggered between siblings, on scroll into view.
function Reveal({children, delay=0, className="", as:Tag="div"}) {
  const ref=useRef(null); const [seen,setSeen]=useState(false);
  useEffect(()=>{ const el=ref.current; if(!el) return;
    if(typeof IntersectionObserver==="undefined"){ setSeen(true); return; }
    const io=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setSeen(true); io.disconnect(); } },
      { rootMargin:"0px 0px -8% 0px", threshold:.12 });
    io.observe(el); return ()=>io.disconnect(); },[]);
  return <Tag ref={ref} className={cx("reveal", seen&&"in", className)} style={{"--d":delay+"ms"}}>{children}</Tag>;
}
// Section headings reveal word by word.
function WordReveal({text, className=""}) {
  const ref=useRef(null); const [seen,setSeen]=useState(false);
  useEffect(()=>{ const el=ref.current; if(!el) return;
    if(typeof IntersectionObserver==="undefined"){ setSeen(true); return; }
    const io=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setSeen(true); io.disconnect(); } },{threshold:.2});
    io.observe(el); return ()=>io.disconnect(); },[]);
  const words=text.split(" ");
  // A real space sits between spans (not &nbsp; inside them), so text stays copy/searchable
  // and the browser can still wrap naturally between words.
  return <span ref={ref} className={className}>{words.map((w,i)=><React.Fragment key={i}>
    <span className={cx("reveal inline-block", seen&&"in")} style={{"--d":(i*45)+"ms"}}>{w}</span>
    {i<words.length-1?" ":""}</React.Fragment>)}</span>;
}
// Pause ambient loops while a block is off-screen (performance requirement).
function usePausedOffscreen(){
  const ref=useRef(null); const [on,setOn]=useState(true);
  useEffect(()=>{ const el=ref.current; if(!el||typeof IntersectionObserver==="undefined") return;
    const io=new IntersectionObserver(([e])=>setOn(e.isIntersecting),{rootMargin:"120px"});
    io.observe(el); return ()=>io.disconnect(); },[]);
  return [ref,on];
}
function prefersReducedMotion(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(_){ return false; }
}

    const t=setTimeout(()=>{ setPhase(p=> p>=N+1 ? 0 : p+1); }, gap);

  const restoreTo=useRef(typeof document!=="undefined"?document.activeElement:null);

  useEffect(()=>{
    if(firstRef.current) firstRef.current.focus();
    const onKey=(e)=>{
      if(e.key==="Escape"){ onClose(); return; }
      if(e.key!=="Tab"||!panel.current) return;
      const els=panel.current.querySelectorAll('a[href],button:not([disabled]),input:not([type="hidden"]),select,textarea,[tabindex]:not([tabindex="-1"])');

      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown",onKey);
    return ()=>{ document.removeEventListener("keydown",onKey);
      try{ restoreTo.current && restoreTo.current.focus && restoreTo.current.focus(); }catch(_){} };
  },[onClose]);

  const set=(k,v)=>{ setF(s=>({...s,[k]:v})); if(err[k]) setErr(e=>({...e,[k]:null})); };
  const validate=()=>{ const e={};

    if(!f.email.trim()) e.email="Required";
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.email="Enter a valid email address";
    else if(FREE_EMAIL.includes(f.email.split("@")[1].toLowerCase()))
      e.email="Please use your work email so we can route this to the right team.";
    setErr(e); return Object.keys(e).length===0; };

  const succeed=()=>{
    // Reset the visible form back to blank, but keep the first name around so the
    // success message can still say "Thanks, Alex" after the fields are cleared.
    setSentFirst(f.first); setF(EMPTY_LEAD_FORM); setState("success");
  };

  const submit=(ev)=>{ ev.preventDefault();
    // Validation always runs first, so a genuine (if fast) submission never gets silently
    // swallowed by the anti-spam checks below — those only gate submissions that already pass.
    if(!validate()) return;
    const now=Date.now();
    // spam guards: honeypot filled, submitted implausibly fast, or double-fired.
    // Show success anyway so a bot gets no signal that it was rejected.
    if(f.website || now-openedAt.current<1200 || now-lastSubmit.current<2500){ succeed(); return; }
    lastSubmit.current=now; setState("submitting");
    const {website, ...clean}=f;
    // Payload keys must match the Apps Script doPost() handler's d.first / d.last / d.email /
    // d.company / d.jobTitle / d.phone / d.useCase / d.submittedAt / d.source reads exactly.
    const payload={...clean, submittedAt:new Date().toISOString(), source:"brainlee-site"};
    try{ const all=JSON.parse(localStorage.getItem("brainlee_leads")||"[]");
      all.push(payload); localStorage.setItem("brainlee_leads",JSON.stringify(all)); }catch(_){}
    const endpoint=(typeof window!=="undefined" && window.__LEAD_ENDPOINT) || "";
    if(!endpoint){ if(IS_DEV) console.info("[Brainlee] lead captured (no endpoint configured):",payload);
      setTimeout(succeed,650); return; }
    let done=false;
    const ok=()=>{ if(!done){ done=true; succeed(); } };
    const fail=(e)=>{ if(!done){ done=true; setState("error"); if(IS_DEV) console.error("[Brainlee] lead submission failed:",e); } };
    // Apps Script Web Apps don't send CORS headers, so a normal `cors` fetch can never read the
    // response even when the request lands successfully — hence `mode:"no-cors"` (an opaque
    // response) and a plain-text Content-Type (an `application/json` header forces a CORS
    // preflight that Apps Script doesn't answer). The body itself is still JSON; doPost() calls
    // JSON.parse(e.postData.contents) regardless of the declared content type.
    fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      .then(ok).catch(fail);
    // With an opaque response we can't distinguish "succeeded" from "still pending", so treat a
    // silent network as success after a short grace period; a real failure (offline, DNS, etc.)
    // still reaches `fail` first and shows the retry state. The local copy above is the backstop
    // either way.
    setTimeout(ok,2500);
  };

  return <div className="fixed inset-0 z-[90] grid place-items-center px-4 py-8" role="dialog" aria-modal="true" aria-labelledby="lead-title">
    <div className="absolute inset-0 bg-black/70 backdrop-blur-[3px] animate-fadein" onClick={onClose}/>
    <div ref={panel} className="relative w-full max-w-lg max-h-full overflow-y-auto rounded-2xl border border-white/10 bg-surface shadow-[0_40px_120px_rgba(0,0,0,.7)] animate-fadeup">
      {state==="success" ? <div className="p-8 text-center">
          <span className="w-12 h-12 rounded-full bg-ok/15 text-ok grid place-items-center mx-auto"><Icon.checkc size={26}/></span>
          <div id="lead-title" className="text-[18px] font-medium text-txt mt-4">Request received</div>
          <p className="text-[14px] leading-[1.6] text-txt-muted mt-2 max-w-sm mx-auto">
            Thanks{sentFirst?", "+sentFirst:""}. We'll be in touch within one business day to arrange your demo.</p>
          <div className="mt-6"><MkBtn onClick={onClose}>Done</MkBtn></div>
        </div>
      : <form onSubmit={submit} noValidate>
          <div className="px-6 pt-5 pb-4 border-b border-white/[.07] flex items-start gap-3">
            <div className="flex-1">
              <div id="lead-title" className="text-[17px] font-medium text-txt">Request a Demo</div>
              <p className="text-[13px] text-txt-muted mt-1">We'll walk through Brainlee using your own commercial content.</p>
            </div>
            <button type="button" onClick={onClose} aria-label="Close"
              className="text-txt-dim hover:text-txt rounded-lg p-1.5 hover:bg-white/[.06]"><Icon.x size={18}/></button>
          </div>
          <div className="px-6 py-5 grid sm:grid-cols-2 gap-4">
            <LeadField label="First name" k="first" req ph="Alex" value={f.first} error={err.first} onChange={v=>set("first",v)} inputRef={firstRef}/>
            <LeadField label="Last name"  k="last"  req ph="Morgan" value={f.last} error={err.last} onChange={v=>set("last",v)}/>
            <LeadField label="Company"    k="company" req ph="Your company" full value={f.company} error={err.company} onChange={v=>set("company",v)}/>
            <LeadField label="Work email" k="email" type="email" req ph="you@company.com" full value={f.email} error={err.email} onChange={v=>set("email",v)}/>
            <div>
              <label htmlFor="lf-jobTitle" className="block font-mono text-[10.5px] uppercase tracking-[.14em] text-txt-dim mb-1.5">
                Job title<span className="text-accent-soft"> *</span></label>
              <select id="lf-jobTitle" value={f.jobTitle} onChange={e=>set("jobTitle",e.target.value)}
                aria-required="true" aria-invalid={!!err.jobTitle}
                className={cx("w-full rounded-lg border bg-white/[.03] px-3 py-2.5 text-[14px] outline-none",
                  err.jobTitle?"border-rose-400/60":"border-white/10 focus:border-accent/50", f.jobTitle?"text-txt":"text-txt-dim")}>
                <option value="" className="bg-surface">Select…</option>
                {MK_ROLES.map(r=><option key={r} value={r} className="bg-surface text-txt">{r}</option>)}
              </select>
              {err.jobTitle && <div className="text-[11.5px] text-rose-300 mt-1.5">{err.jobTitle}</div>}
            </div>
            <LeadField label="Phone" k="phone" type="tel" ph="Optional" value={f.phone} error={err.phone} onChange={v=>set("phone",v)}/>
            <LeadField label="Use case" k="useCase" rows={2} ph="What should your Brand Brain answer first?" full value={f.useCase} error={err.useCase} onChange={v=>set("useCase",v)}/>
            {/* honeypot — hidden from people, tempting to bots */}
            <div className="hidden" aria-hidden="true">
              <label htmlFor="lf-website">Website</label>
              <input id="lf-website" tabIndex={-1} autoComplete="off" value={f.website} onChange={e=>set("website",e.target.value)}/>
            </div>
          </div>
          {state==="error" && <div className="mx-6 mb-4 rounded-lg border border-rose-400/30 bg-rose-500/10 px-3.5 py-2.5 text-[13px] text-rose-200">
            That didn't go through. Please try again.</div>}
          <div className="px-6 py-4 border-t border-white/[.07] flex items-center gap-3">
            <span className="font-mono text-[10.5px] text-txt-dim flex-1">We'll only use this to arrange your demo.</span>
            <MkBtn variant="ghost" onClick={onClose}>Cancel</MkBtn>
            <MkBtn type="submit" disabled={state==="submitting"}>
              {state==="submitting"?"Sending…":state==="error"?"Try again":"Request a Demo"}</MkBtn>
          </div>
        </form>}
    </div>
  </div>;
}
